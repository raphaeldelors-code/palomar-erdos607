fidelity:
  divergences: >-
    The Colbourn–Phelps–Rödl (1984) Theorem 2.4 PBD profile bound is taken as a
    hypothesis (hCPR) rather than re-proved, and the bound is stated for
    n ≥ 2, the range in which it is meaningful (so the hypothesis is
    non-vacuous). The formalization proves the reduction from Erdős 607
    multiplicity sets to PBD profile sets and the resulting exp(c·√n) upper
    bound conditional on that published theorem. The matching
    Szemerédi–Trotter (1983) lower bound F(n) ≥ exp(c'·√n), used to state the
    order of growth F(n) = exp(Θ(√n)), is cited and not re-proved or
    formalized.

