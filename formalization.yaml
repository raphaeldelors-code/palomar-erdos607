status:
  scope: >-
    Formalizes the upper bound F(n) ≤ exp(c·√n) for every n ≥ 2 on the number
    of distinct multiplicity sets of n-point plane configurations (Erdős
    problem 607), conditional on the Colbourn–Phelps–Rödl (1984) PBD profile
    bound, which is taken as the hypothesis hCPR and cited rather than
    re-proved. The bound is stated for n ≥ 2 (a single point determines no
    line), so the hypothesis is non-vacuous. Combined with the cited
    Szemerédi–Trotter (1983) lower bound F(n) ≥ exp(c'·√n), the order of
    growth is F(n) = exp(Θ(√n)). The proof library (Erdos607/Proof.lean)
    contains no axioms and no sorry; the only sorry in the repository is the
    deliberate statement surface in Challenge.lean.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

